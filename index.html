<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e30620" />
  <title>LevelUp App Administrador</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root{--navy:#111923;--red:#e30620;--green:#10b981;--amber:#f59e0b;--bg:#f4f6f8;--card:#fff;--soft:#eef1f5;--text:#111923;--muted:#657083;--border:#d9dee8}
    [data-theme=dark]{--bg:#080d16;--card:#111923;--soft:#182334;--text:#f8fafc;--muted:#a6b1c2;--border:#273449}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}
    .app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:18px;padding:14px;background:#fff;color:var(--navy)}.logo{height:54px;width:54px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;position:relative}.logo small{position:absolute;right:-7px;top:-8px;background:var(--red);border-radius:999px;padding:2px 5px;font-size:11px}.brand b{font-size:24px}.brand b span{color:var(--red)}.brand p{margin:0;color:#445;letter-spacing:.28em;font-size:11px;font-weight:700}.nav{display:grid;gap:8px;overflow:auto}.nav button{border:0;border-radius:14px;background:transparent;color:var(--text);display:flex;align-items:center;gap:10px;padding:12px;text-align:left;font-weight:700;cursor:pointer}.nav button.active{background:var(--red);color:#fff}.quick{margin-top:auto;background:var(--soft);border-radius:18px;padding:14px;display:grid;gap:8px}.quick div,.row{display:flex;justify-content:space-between;gap:12px}.main{min-width:0}.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:25px}.top p{margin:2px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}.content{padding:24px;display:grid;gap:22px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.two{grid-template-columns:1.1fr .9fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 2px 7px #11192312}.stat{min-height:126px}.stat p{margin:0 0 8px;color:var(--muted)}.stat strong{display:block;font-size:26px}.card h2{margin:0 0 16px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;outline:none}textarea{min-height:86px;resize:vertical}.btn{border:1px solid transparent;border-radius:10px;padding:10px 13px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.ghost{background:var(--card);border-color:var(--border);color:var(--text)}.btn:disabled{opacity:.55;cursor:not-allowed}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase}.pill{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.ok{color:#065f46;background:#ecfdf5;border-color:#bbf7d0}.warn{color:#92400e;background:#fffbeb;border-color:#fde68a}.msg{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--soft);white-space:pre-wrap}.mobile{display:none}.hidden{display:none!important}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.side.open{display:flex;position:fixed;z-index:30;inset:0 auto 0 0;width:280px}.mobile{display:inline-flex}.top{padding:14px 16px}.top p{display:none}.content{padding:16px}.stats,.two,.three{grid-template-columns:1fr}.actions .desktop-only{display:none}table{min-width:620px}}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const SUPABASE_URL="https://gnkwgayrectwuivplaxa.supabase.co";
const SUPABASE_KEY="sb_publishable_XJ5x90P2pYjHtHHAFP7LNA_Ezz7QoRf";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const LS="levelup_online_state_v1";
const money=n=>new Intl.NumberFormat("es-GT",{style:"currency",currency:"GTQ"}).format(Number(n)||0);
const id=()=>crypto.randomUUID?crypto.randomUUID():`id_${Date.now()}_${Math.random().toString(36).slice(2)}`;
const today=()=>new Date().toISOString().slice(0,10);
const defaults={theme:"light",view:"dashboard",products:[{id:id(),nombre:"Monitor HP OMEN 24 pulgadas",modelo:"780D9AA#ABA",categoria:"Monitores",costo:1400,impuesto:5,envio:50,margen:15,stock:1}],sales:[],services:[],imports:[],clients:[],expenses:[],log:[]};
let state=load(),user=null,cloudMsg="";
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(LS)||"{}")}}catch{return {...defaults}}}
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function set(patch){state={...state,...patch};save();render()}
function addLog(a,d=""){state.log=[{id:id(),fecha:new Date().toISOString(),accion:a,detalle:d},...(state.log||[])].slice(0,80);save()}
function calc(p){const c=Number(p.costo)||0,t=c*((Number(p.impuesto)||0)/100),total=c+t+(Number(p.envio)||0),m=Number(p.margen)||0,price=m>=100?0:Math.ceil((total/(1-m/100))/10)*10-1;return{total,price,profit:price-total,stock:Number(p.stock)||0}}
function serviceTotal(s){return (Number(s.costo)||0)+(s.prioridad==="Urgente"?75:s.prioridad==="Express"?125:0)}
function importTotal(o){return ["costo","envio","impuesto","comision"].reduce((a,k)=>a+(Number(o[k])||0),0)}
function backup(){return {...state,version:"LevelUp-online-v1",exportedAt:new Date().toISOString()}}
function restore(data){state={...defaults,...data,view:"dashboard"};save();addLog("Backup restaurado","Datos cargados correctamente");render()}
async function refreshUser(){const {data}=await db.auth.getSession();user=data.session?.user||null;render()}
db.auth.onAuthStateChange((_e,session)=>{user=session?.user||null;render()});refreshUser();
const nav=[["dashboard","▦","Panel principal"],["inventario","📦","Inventario"],["servicio","🛠️","Servicio Técnico"],["importaciones","⬆️","Importaciones"],["clientes","👥","Clientes"],["ventas","📈","Ventas"],["backup","☁️","Backup / Nube"]];
function layout(title,body){const stock=state.products.reduce((a,p)=>a+(Number(p.stock)||0),0),profit=state.sales.reduce((a,s)=>a+(Number(s.ganancia)||0),0);document.documentElement.dataset.theme=state.theme;document.getElementById("app").innerHTML=`<aside id="side" class="side"><div class="brand"><div class="logo">L<small>UP</small></div><div><b>LEVEL<span>UP</span></b><p>REPAIR CENTER</p></div></div><nav class="nav">${nav.map(n=>`<button class="${state.view===n[0]?"active":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav><div class="quick"><small>Resumen rápido</small><div><span>Stock</span><b>${stock}</b></div><div><span>Servicios</span><b>${state.services.length}</b></div><div><span>Ganancia</span><b>${money(profit)}</b></div></div></aside><main class="main"><header class="top"><div class="toolbar"><button class="btn ghost mobile" onclick="toggleSide()">☰</button><div><h1>${title}</h1><p>LevelUp Repair Center · sistema administrativo en español 🚀</p></div></div><div class="actions"><button class="btn ghost desktop-only" onclick="toggleTheme()">${state.theme==="dark"?"☀️":"🌙"}</button><button class="btn red" onclick="go('backup')">☁️</button></div></header><section class="content">${body}</section></main>`}
function go(v){state.view=v;save();render()}
function toggleSide(){document.getElementById("side").classList.toggle("open")}
function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";save();render()}
function render(){({dashboard, inventario, servicio, importaciones, clientes, ventas, backup:backupView}[state.view]||dashboard)()}
function dashboard(){const stock=state.products.reduce((a,p)=>a+calc(p).stock,0),inv=state.products.reduce((a,p)=>a+calc(p).total*calc(p).stock,0),util=state.products.reduce((a,p)=>a+calc(p).profit*calc(p).stock,0),sales=state.sales.reduce((a,s)=>a+Number(s.precio||0),0),profit=state.sales.reduce((a,s)=>a+Number(s.ganancia||0),0);layout("Panel principal",`<div class="grid stats"><div class="card stat"><p>Stock total</p><strong>${stock}</strong><small>Unidades disponibles</small></div><div class="card stat"><p>Servicios</p><strong>${state.services.length}</strong><small>Equipos registrados</small></div><div class="card stat"><p>Importaciones</p><strong>${state.imports.length}</strong><small>Pedidos abiertos</small></div><div class="card stat"><p>Ventas</p><strong>${money(sales)}</strong><small>Historial registrado</small></div><div class="card stat"><p>Ganancia</p><strong>${money(profit)}</strong><small>Utilidad real</small></div></div><div class="grid three"><div class="card"><h2>Cotización actual</h2><div class="row"><span>Inversión</span><b>${money(inv)}</b></div><div class="row"><span>Utilidad esperada</span><b>${money(util)}</b></div></div><div class="card"><h2>Estado nube</h2><p>${user?`Conectado como <b>${user.email}</b>`:"Sin sesión de Supabase"}</p><button class="btn red" onclick="go('backup')">Configurar nube</button></div><div class="card"><h2>Salud app</h2><strong>Estable ✅</strong><p>Datos locales + backup Supabase.</p></div></div>`)}
function form(fields,action,label="Guardar"){return `<form onsubmit="${action};return false">${fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[3]==="textarea"?`<textarea name="${f[0]}"></textarea>`:`<input name="${f[0]}" type="${f[2]||"text"}" ${f[4]?`value="${f[4]}"`:""}>`}</div>`).join("")}<button class="btn red">${label}</button></form>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td colspan="${headers.length}">Sin registros todavía.</td></tr>`}</tbody></table></div>`}
function inventario(){layout("Inventario",`<div class="grid two"><div class="card"><h2>Nuevo producto</h2>${form([["nombre","Producto"],["modelo","Modelo"],["categoria","Categoría"],["costo","Costo","number"],["impuesto","Impuesto %","number","input","0"],["envio","Envío / operación","number","input","0"],["margen","Margen %","number","input","15"],["stock","Stock","number","input","1"]],"addProduct(this)")}</div><div class="card"><h2>Productos</h2>${table(["Producto","Costo total","Precio sugerido","Stock","Acciones"],state.products.map(p=>{const c=calc(p);return `<tr><td><b>${p.nombre}</b><br><small>${p.modelo||""} · ${p.categoria||""}</small></td><td>${money(c.total)}</td><td><b style="color:var(--red)">${money(c.price)}</b></td><td>${p.stock||0}</td><td><button class="btn green" onclick="sell('${p.id}')">Vender</button> <button class="btn ghost" onclick="del('products','${p.id}')">Borrar</button></td></tr>`}))}</div></div>`)}
function addProduct(f){const p=Object.fromEntries(new FormData(f));p.id=id();state.products=[p,...state.products];addLog("Producto agregado",p.nombre);save();render()}
function sell(pid){const p=state.products.find(x=>x.id===pid);if(!p)return;const c=calc(p);state.sales=[{id:id(),fecha:new Date().toISOString(),producto:p.nombre,cliente:"Cliente final",precio:c.price,ganancia:c.profit},...state.sales];state.products=state.products.map(x=>x.id===pid?{...x,stock:Math.max(0,(Number(x.stock)||0)-1)}:x);addLog("Venta registrada",p.nombre);save();render()}
function servicio(){layout("Servicio Técnico",`<div class="grid two"><div class="card"><h2>Nueva orden</h2>${form([["cliente","Cliente"],["telefono","Teléfono"],["equipo","Equipo"],["marca","Marca"],["modelo","Modelo"],["problema","Problema","text","textarea"],["costo","Costo estimado","number"],["prioridad","Prioridad"],["estado","Estado"]],"addService(this)")}</div><div class="card"><h2>Órdenes</h2>${table(["Orden","Cliente","Equipo","Estado","Total","Acciones"],state.services.map(s=>`<tr><td><b>${s.codigo}</b></td><td>${s.cliente}<br><small>${s.telefono||""}</small></td><td>${s.equipo} ${s.marca||""} ${s.modelo||""}</td><td><span class="pill warn">${s.estado||"Recibido"}</span></td><td>${money(serviceTotal(s))}</td><td><button class="btn ghost" onclick="wa('${s.id}')">WhatsApp</button> <button class="btn ghost" onclick="del('services','${s.id}')">Borrar</button></td></tr>`))}</div></div><div id="msg"></div>`)}
function addService(f){const s=Object.fromEntries(new FormData(f));s.id=id();s.codigo=`LU-${new Date().getFullYear()}-${String(state.services.length+1).padStart(4,"0")}`;state.services=[s,...state.services];addLog("Servicio registrado",s.codigo);save();render()}
function wa(sid){const s=state.services.find(x=>x.id===sid),txt=`Hola ${s.cliente||"estimado cliente"} 👋%0ATe saludamos de LevelUp Repair Center 🚀%0AOrden: ${s.codigo}%0AEquipo: ${s.equipo||""} ${s.marca||""} ${s.modelo||""}%0AEstado: ${s.estado||"Recibido"}%0ATotal estimado: ${money(serviceTotal(s))}`;document.getElementById("msg").innerHTML=`<div class="card"><h2>Mensaje WhatsApp</h2><p class="msg">${decodeURIComponent(txt)}</p><a class="btn green" target="_blank" href="https://api.whatsapp.com/send?phone=502${String(s.telefono||"").replace(/\D/g,"")}&text=${txt}">Abrir WhatsApp</a></div>`}
function importaciones(){layout("Importaciones",`<div class="grid two"><div class="card"><h2>Nueva importación</h2>${form([["cliente","Cliente"],["telefono","Teléfono"],["producto","Producto"],["origen","País de origen"],["tracking","Tracking"],["costo","Costo","number"],["envio","Envío","number"],["impuesto","Impuesto","number"],["comision","Comisión","number"],["estado","Estado"]],"addImport(this)")}</div><div class="card"><h2>Pedidos</h2>${table(["Pedido","Cliente","Producto","Estado","Total","Acciones"],state.imports.map(o=>`<tr><td><b>${o.codigo}</b><br><small>${o.tracking||"sin tracking"}</small></td><td>${o.cliente}</td><td>${o.producto}<br><small>${o.origen||""}</small></td><td><span class="pill warn">${o.estado||"Cotizado"}</span></td><td>${money(importTotal(o))}</td><td><button class="btn ghost" onclick="del('imports','${o.id}')">Borrar</button></td></tr>`))}</div></div>`)}
function addImport(f){const o=Object.fromEntries(new FormData(f));o.id=id();o.codigo=`IMP-${new Date().getFullYear()}-${String(state.imports.length+1).padStart(4,"0")}`;state.imports=[o,...state.imports];addLog("Importación registrada",o.codigo);save();render()}
function clientes(){layout("Clientes",`<div class="grid two"><div class="card"><h2>Nuevo cliente</h2>${form([["nombre","Nombre"],["telefono","Teléfono"],["direccion","Dirección"],["notas","Notas","text","textarea"]],"addClient(this)")}</div><div class="card"><h2>Clientes</h2>${table(["Nombre","Teléfono","Dirección","Notas","Acciones"],state.clients.map(c=>`<tr><td><b>${c.nombre}</b></td><td>${c.telefono||""}</td><td>${c.direccion||""}</td><td>${c.notas||""}</td><td><button class="btn ghost" onclick="del('clients','${c.id}')">Borrar</button></td></tr>`))}</div></div>`)}
function addClient(f){const c=Object.fromEntries(new FormData(f));c.id=id();state.clients=[c,...state.clients];addLog("Cliente agregado",c.nombre);save();render()}
function ventas(){layout("Ventas",`<div class="card"><h2>Historial de ventas</h2>${table(["Fecha","Producto","Cliente","Venta","Ganancia"],state.sales.map(s=>`<tr><td>${new Date(s.fecha).toLocaleString("es-GT")}</td><td>${s.producto}</td><td>${s.cliente}</td><td>${money(s.precio)}</td><td>${money(s.ganancia)}</td></tr>`))}</div>`)}
function backupView(){layout("Backup / Nube",`<div class="grid two"><div class="card"><h2>Backup local</h2><div class="toolbar"><button class="btn green" onclick="exportJson()">Exportar JSON</button><label class="btn ghost">Importar JSON<input type="file" accept="application/json" onchange="importJson(this)" hidden></label></div><p>También puedes guardar una copia en Supabase para usarla desde otro equipo.</p></div><div class="card"><h2>Supabase ☁️</h2><p>${user?`Conectado como <b>${user.email}</b>`:"Sin sesión. Crea cuenta o inicia sesión para sincronizar."}</p>${user?`<div class="toolbar"><button class="btn green" onclick="saveCloud()">Guardar en Supabase ☁️</button><button class="btn" onclick="loadCloud()">Cargar desde Supabase</button><button class="btn ghost" onclick="logout()">Cerrar sesión</button></div>`:`<div class="grid"><input id="email" type="email" placeholder="correo@ejemplo.com"><input id="pass" type="password" placeholder="Contraseña"><div class="toolbar"><button class="btn" onclick="login()">Entrar</button><button class="btn red" onclick="signup()">Crear cuenta</button></div></div>`}${cloudMsg?`<p class="msg">${cloudMsg}</p>`:""}</div></div><div class="card"><h2>Bitácora</h2>${table(["Fecha","Acción","Detalle"],(state.log||[]).map(l=>`<tr><td>${new Date(l.fecha).toLocaleString("es-GT")}</td><td>${l.accion}</td><td>${l.detalle||""}</td></tr>`))}</div>`)}
function exportJson(){const blob=new Blob([JSON.stringify(backup(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`levelup_backup_${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importJson(input){const file=input.files[0];if(!file)return;restore(JSON.parse(await file.text()));input.value=""}
async function login(){const {error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});cloudMsg=error?error.message:"Sesión iniciada ✅";refreshUser()}
async function signup(){const {error}=await db.auth.signUp({email:email.value,password:pass.value});cloudMsg=error?error.message:"Cuenta creada. Revisa tu correo si Supabase pide confirmación.";refreshUser()}
async function logout(){await db.auth.signOut();cloudMsg="Sesión cerrada.";refreshUser()}
async function saveCloud(){if(!user)return;const payload={id:`cloud_backup_${user.id}`,data:backup(),created_by:user.id,updated_by:user.id,updated_at:new Date().toISOString()};const {error}=await db.from("levelup_settings").upsert(payload,{onConflict:"id"});cloudMsg=error?error.message:"Backup guardado en Supabase ☁️";addLog("Backup en nube","Datos guardados en Supabase");save();render()}
async function loadCloud(){if(!user)return;const {data,error}=await db.from("levelup_settings").select("data,updated_at").eq("id",`cloud_backup_${user.id}`).maybeSingle();if(error)cloudMsg=error.message;else if(!data)cloudMsg="No hay backup en Supabase para este usuario.";else{restore(data.data);cloudMsg=`Backup cargado desde Supabase (${new Date(data.updated_at).toLocaleString("es-GT")})`}}
function del(collection,itemId){state[collection]=state[collection].filter(x=>x.id!==itemId);addLog("Registro eliminado",collection);save();render()}
render();
</script>
</body>
</html>
